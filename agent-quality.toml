# Edit these commands to match this repository.
# Each command is an argument array; no shell expansion is performed.
# A non-zero exit code fails the quality run.

[quality]
working_directory = "."

[[quality.commands]]
name = "unit-and-integration-tests"
required = true
argv = ["python", "-m", "pytest"]

[[quality.commands]]
name = "lint"
required = false
argv = ["ruff", "check", "."]

